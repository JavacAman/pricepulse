# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/pricepulse_db
spring.datasource.username=root
spring.datasource.password=Admin@2310
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# App Configuration
server.port=8080
spring.application.name=pricepulse

#JWT Secret
jwt.secret=pricepulse-secret-key-this-must-be-very-long-for-security
jwt.expiration=86400000

